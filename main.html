<!DOCTYPE html>

<html>

<head>
     <style>
        table, th, td {
            border: 2px solid black;
            border-collapse: collapse;
            
        }

        table {
            width: 800px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 4px;
            text-align: left;
        }

        /* Dark red header */
        thead {
            background-color: #c0504d;
            color: white;
        }

        /* Light red rows */
        tbody tr:nth-child(1) {
            background-color: #d99694;
        }

        /* Very light red row */
        tbody tr:nth-child(2) {
            background-color: #f2dcdb;
        }

        /* Light gray row */
        tbody tr:nth-child(3) {
            background-color: #d9d9d9;
        }
    </style> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Size Chart</title>
    
</head>
<body>
    <table>
        <thead>
            <tr>
                <td>Part</td>
                <td>XS</td>
                <td>S</td>
                <td>M</td>
                <td>L</td>
                <td>XL</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Waist</td>
                <td>25</td>
                <td>28</td>
                <td>30</td>
                <td>31</td>
                <td>32</td>
            </tr>
            <tr>
                <td>Chest</td>
                <td>34</td>
                <td>34</td>
                <td>38</td>
                <td>40</td>
                <td>41</td>
            </tr>
            <tr>
                <td>Sleeve</td>
                <td>23</td>
                <td>24</td>
                <td>24</td>
                <td>25</td>
                <td>25</td>
            </tr>
        </tbody>
       
       
    </table>
</body>
</html>
